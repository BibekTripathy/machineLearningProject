# Cancer Network Analysis Pipeline Configuration
# Following framework document guidelines for ML training data generation

project:
  name: "Cancer_Network_Analysis"
  organism: "9606"                    # Homo sapiens NCBI taxonomy ID
  disease: "Cancer"                   # Disease type for ML labeling
  disease_code: "CANCER"              # Short code for file naming
  description: "ML-driven gene score prediction for cancer detection"

# STRING Database Configuration [cite: 27, 303, 305]
string:
  min_combined_score: 0.7             # High-confidence threshold (0-1 scale)
  version_tag: "v12.0"                # STRING database version
  species: 9606                       # Homo sapiens
  include_interactions:
    physical: true
    functional: true

# Network Propagation Configuration [cite: 230, 316, 317]
propagation:
  methods: ["rwr"]                    # Random Walk with Restart (baseline)
  rwr:
    restart_prob: 0.7                 # Alpha parameter [cite: 230]
    max_iter: 100                     # Maximum iterations
    tol: 1.0e-10                      # Convergence tolerance
    top_k: 500                        # Genes to keep after propagation [cite: 230]
    use_edge_weights: true            # Use weighted edges

# Community Detection Configuration [cite: 41, 42, 321]
clustering:
  methods: ["leiden"]                 # Leiden (preferred over Louvain)
  algorithm: "ModularityVertexPartition"
  resolution: 1.0                     # Resolution parameter
  random_seed: 42                     # For reproducibility
  min_module_size: 3                  # Minimum genes per module for ML

# Enrichment Analysis Configuration [cite: 58, 60, 289]
enrichment:
  enabled: true
  tool: "gprofiler"
  organism: "hsapiens"
  sources: ["GO:BP", "GO:CC", "GO:MF", "REAC", "WP", "CORUM"]
  significance_threshold: 0.05        # FDR threshold
  max_terms: 50                       # Top terms per module

# ML Training Data Configuration
ml:
  feature_types: ["module_membership", "propagation_score", "module_density", "module_size"]
  normalize_features: true
  min_module_for_feature: 3           # Skip tiny modules
  include_module_quality: true        # Add density, size as features

# Provenance and Reproducibility
provenance:
  track_git: true
  track_config: true
  generate_sidecars: true             # Create .meta.json files

# Output Paths (relative to project_root)
paths:
  resources_dir: "resources"
  results_dir: "results"
  genes_dir: "results/genes"
  networks_dir: "results/networks"
  modules_dir: "results/modules"
  enrichment_dir: "results/enrichment"
  reports_dir: "results/reports"
