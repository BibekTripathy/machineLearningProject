project:
  organism: "9606"  # Homo sapiens
  disease: "Cancer_Analysis"

string:
  min_combined_score: 0.7  # High-confidence threshold [cite: 27]
  version_tag: "v12.0"

propagation:
  rwr:
    restart_prob: 0.7      # Standard alpha [cite: 230]
    top_k: 500             # Genes to keep after propagation [cite: 230]

clustering:
  methods: ["leiden"]      # Preferred over Louvain [cite: 41, 42]
  resolution: 1.0
  min_module_size: 10
